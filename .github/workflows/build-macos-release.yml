name: macOS CI / signed optional release build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    outputs:
      apple_signing_available: ${{ steps.apple-signing.outputs.available }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
            swift_target: arm64-apple-macosx12.0
            asset: CodexBridge-macOS-AppleSilicon.zip
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            swift_target: x86_64-apple-macosx12.0
            asset: CodexBridge-macOS-Intel.zip
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate public version metadata
        run: |
          set -euo pipefail
          build_log="$RUNNER_TEMP/codexbridge-launcher-build.log"
          : > "$build_log"
          exec > >(tee "$build_log") 2>&1
          trap 'code=$?; if [[ "$code" -ne 0 ]]; then message="$(tail -c 6000 "$build_log" | tr "\\n" " " | tr "\\r" " ")"; echo "::error file=.github/workflows/build-macos-release.yml::$message"; fi' EXIT
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid VERSION value: $version"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match VERSION (v$version)."
            exit 1
          fi
          echo "Public product version: $version"

      - name: Normalize macOS executable permissions
        run: |
          chmod +x "Start CodexBridge.command"
          chmod +x scripts/unix/codex_bridge_manager.sh scripts/unix/codex_bridge_watcher.sh scripts/unix/codex_bridge_uninstall.sh

          git_mode="$(git ls-files --stage -- "Start CodexBridge.command" | awk '{print $1}')"
          if [[ "$git_mode" != "100755" ]]; then
            echo "::warning::Start CodexBridge.command is not marked executable in the Git index. Release artifacts are normalized here, but before publishing the public source ZIP from Windows run scripts/maintainer/PrepareGitHubFromWindows.ps1 and commit the mode change."
          fi

      - name: Build macOS menu bar launcher bundle
        env:
          SWIFT_TARGET: ${{ matrix.swift_target }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          app="$RUNNER_TEMP/CodexBridge.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS"
          swift_log="$RUNNER_TEMP/codexbridge-swiftc.log"
          if ! swiftc -O -target "$SWIFT_TARGET" \
            src/launcher-macos/CodexBridgeLauncher.swift \
            -o "$app/Contents/MacOS/CodexBridge" 2>"$swift_log"; then
            {
              echo '### Swift compiler output'
              echo '```text'
              cat "$swift_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            compiler_message="$(tr '\n' ' ' < "$swift_log" | cut -c 1-6000)"
            echo "::error file=src/launcher-macos/CodexBridgeLauncher.swift::$compiler_message"
            cat "$swift_log" >&2
            exit 1
          fi
          sed "s/@VERSION@/$version/g" src/launcher-macos/Info.plist.in > "$app/Contents/Info.plist"
          chmod +x "$app/Contents/MacOS/CodexBridge"
          if [[ ! -x "$app/Contents/MacOS/CodexBridge" ]]; then
            echo "::error::Launcher executable was not created or is not executable."
            exit 1
          fi
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" || { echo "::error::Could not read CFBundleIdentifier from Info.plist."; exit 1; }
          [[ "$bundle_id" == 'com.strengw.codexbridge.launcher' ]] || { echo "::error::Unexpected bundle identifier: $bundle_id"; exit 1; }
          short_version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" || { echo "::error::Could not read CFBundleShortVersionString from Info.plist."; exit 1; }
          [[ "$short_version" == "$version" ]] || { echo "::error::Unexpected launcher version: $short_version (expected $version)."; exit 1; }
          ui_element="$(plutil -extract LSUIElement raw -o - "$app/Contents/Info.plist")" || { echo "::error::Could not read LSUIElement from Info.plist."; exit 1; }
          [[ "$ui_element" == '1' || "$ui_element" == 'true' ]] || { echo "::error::LSUIElement is not true: $ui_element"; exit 1; }
          file_output="$(/usr/bin/file -b "$app/Contents/MacOS/CodexBridge")"
          echo "$file_output"
          if [[ "$SWIFT_TARGET" == arm64-* ]]; then
            [[ "$file_output" == *arm64* ]] || { echo "::error::Launcher architecture is not arm64: $file_output"; exit 1; }
          else
            [[ "$file_output" == *x86_64* ]] || { echo "::error::Launcher architecture is not x86_64: $file_output"; exit 1; }
          fi

      - name: Create isolated macOS CI test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/codexbridge-ci-venv"
          "$RUNNER_TEMP/codexbridge-ci-venv/bin/python" -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Run regression tests
        run: |
          "$RUNNER_TEMP/codexbridge-ci-venv/bin/python" -m pytest tests -v

      - name: Check Apple signing configuration
        id: apple-signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          available=true
          for value in \
            "$MACOS_CERTIFICATE_P12_BASE64" \
            "$MACOS_CERTIFICATE_PASSWORD" \
            "$MACOS_SIGNING_IDENTITY" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$APPLE_APP_SPECIFIC_PASSWORD"; do
            if [[ -z "$value" ]]; then
              available=false
            fi
          done

          echo "available=$available" >> "$GITHUB_OUTPUT"

          if [[ "$available" == "true" ]]; then
            echo "Apple signing/notarization credentials are available."
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::notice::Apple signing credentials are not configured. This tag will publish clearly labeled unsigned macOS Release assets (ad-hoc signed so Gatekeeper shows the standard unverified-developer flow); macOS 15+ users approve them via System Settings -> Privacy & Security -> Open Anyway."
          else
            echo "::notice::Apple signing credentials are not configured. This run will produce unsigned macOS CI artifacts only."
          fi

      - name: Assemble self-contained portable macOS package
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          stage_parent="$RUNNER_TEMP/CodexBridge Portable 测试 with spaces"
          stage="$stage_parent/CodexBridge"
          rm -rf "$stage_parent"
          mkdir -p "$stage/scripts/unix" "$stage/src/bridge" "$stage/runtime" dist

          cp "Start CodexBridge.command" "$stage/"
          cp scripts/unix/codex_bridge_manager.sh "$stage/scripts/unix/"
          cp scripts/unix/codex_bridge_watcher.sh "$stage/scripts/unix/"
          cp scripts/unix/codex_bridge_uninstall.sh "$stage/scripts/unix/"
          cp src/bridge/codex_provider_bridge.py "$stage/src/bridge/"
          /usr/bin/ditto "$RUNNER_TEMP/CodexBridge.app" "$stage/CodexBridge.app"
          cp README.md README.en.md VERSION CHANGELOG.md SECURITY.md "$stage/"
          mkdir -p "$stage/docs"
          cp docs/ARCHITECTURE.md docs/COMPATIBILITY.md docs/VERSIONING.md docs/PROJECT_OVERVIEW.zh-CN.md docs/USER_GUIDE.zh-CN.md "$stage/docs/"
          chmod +x "$stage/Start CodexBridge.command" "$stage/scripts/unix/"*.sh "$stage/CodexBridge.app/Contents/MacOS/CodexBridge"

          release_id="$(gh api repos/astral-sh/python-build-standalone/releases/latest --jq '.id')"
          asset_jq=".[] | select((.name | startswith(\"cpython-3.12.\")) and (.name | endswith(\"-${TARGET}-install_only_stripped.tar.gz\"))) | .browser_download_url"
          url="$(gh api --paginate "repos/astral-sh/python-build-standalone/releases/${release_id}/assets?per_page=100" --jq "$asset_jq" | sed -n '1p')"
          if [[ -z "$url" ]]; then
            echo "::error::Could not find a Python 3.12 ${TARGET} install_only_stripped runtime in the latest python-build-standalone release (release id ${release_id})."
            exit 1
          fi
          case "$url" in
            *"-${TARGET}-install_only_stripped.tar.gz") ;;
            *)
              echo "::error::Resolved an unexpected Python runtime URL: $url"
              exit 1
              ;;
          esac
          echo "Bundling portable Python from: $url"
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/python.tar.gz"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$stage/runtime"

          test -x "$stage/runtime/python/bin/python3"
          "$stage/runtime/python/bin/python3" --version
          "$stage/runtime/python/bin/python3" "$stage/src/bridge/codex_provider_bridge.py" --help >/dev/null
          bash -n "$stage/scripts/unix/codex_bridge_manager.sh"
          bash -n "$stage/scripts/unix/codex_bridge_watcher.sh"
          bash -n "$stage/scripts/unix/codex_bridge_uninstall.sh"
          bash -n "$stage/Start CodexBridge.command"
          test -x "$stage/CodexBridge.app/Contents/MacOS/CodexBridge"
          test -f "$stage/CodexBridge.app/Contents/Info.plist"

          version="$(tr -d '[:space:]' < VERSION)"
          echo "CodexBridge $version / ${{ github.ref_name }} / ${{ matrix.arch }}" > "$stage/BUILD.txt"

      - name: Ad-hoc sign unsigned macOS app bundle
        if: steps.apple-signing.outputs.available != 'true'
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/CodexBridge Portable 测试 with spaces/CodexBridge"
          # Without Apple credentials the bundle must still be internally
          # consistent: Gatekeeper reports a bundle as "damaged" - a dialog with
          # no user escape - when its inner executable carries a signature but
          # the outer bundle has none. An ad-hoc signature restores integrity,
          # so users get the standard unverified-developer flow that Open Anyway
          # (macOS 15+) or Right-click -> Open (macOS 14-) clears.
          /usr/bin/codesign --force --deep --sign - "$stage/CodexBridge.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$stage/CodexBridge.app"
          echo "Ad-hoc signed the unsigned CodexBridge.app bundle."

      - name: Import Developer ID certificate
        if: steps.apple-signing.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/codexbridge-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          certificate="$RUNNER_TEMP/codexbridge-developer-id.p12"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

          echo "CODEXBRIDGE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign bundled macOS executable code
        if: steps.apple-signing.outputs.available == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/CodexBridge Portable 测试 with spaces/CodexBridge"
          signed=0

          while IFS= read -r -d '' candidate; do
            if /usr/bin/file -b "$candidate" | grep -q 'Mach-O'; then
              /usr/bin/codesign \
                --force \
                --sign "$MACOS_SIGNING_IDENTITY" \
                --keychain "$CODEXBRIDGE_SIGNING_KEYCHAIN" \
                --options runtime \
                --timestamp \
                "$candidate"
              signed=$((signed + 1))
            fi
          done < <(find "$stage/runtime/python" -type f -print0)

          while IFS= read -r -d '' candidate; do
            if /usr/bin/file -b "$candidate" | grep -q 'Mach-O'; then
              /usr/bin/codesign \
                --force \
                --sign "$MACOS_SIGNING_IDENTITY" \
                --keychain "$CODEXBRIDGE_SIGNING_KEYCHAIN" \
                --options runtime \
                --timestamp \
                "$candidate"
              signed=$((signed + 1))
            fi
          done < <(find "$stage/CodexBridge.app" -type f -print0)

          if [[ "$signed" -eq 0 ]]; then
            echo "::error::No Mach-O files were found in the bundled Python runtime."
            exit 1
          fi

          while IFS= read -r -d '' candidate; do
            if /usr/bin/file -b "$candidate" | grep -q 'Mach-O'; then
              /usr/bin/codesign --verify --strict --verbose=2 "$candidate"
            fi
          done < <(find "$stage/runtime/python" -type f -print0)

          /usr/bin/codesign \
            --force \
            --sign "$MACOS_SIGNING_IDENTITY" \
            --keychain "$CODEXBRIDGE_SIGNING_KEYCHAIN" \
            --options runtime \
            --timestamp \
            "$stage/CodexBridge.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$stage/CodexBridge.app"

          echo "Developer ID-signed $signed Mach-O files and CodexBridge.app."

      - name: Package and verify macOS archive
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          stage_parent="$RUNNER_TEMP/CodexBridge Portable 测试 with spaces"
          verify="$RUNNER_TEMP/CodexBridge Archive Verify"
          rm -rf "$verify"

          (cd "$stage_parent" && /usr/bin/ditto -c -k --sequesterRsrc --keepParent "CodexBridge" "$GITHUB_WORKSPACE/dist/$ASSET")
          shasum -a 256 "dist/$ASSET" | awk '{print $1 "  '"$ASSET"'"}' > "dist/$ASSET.sha256"

          mkdir -p "$verify"
          /usr/bin/ditto -x -k "dist/$ASSET" "$verify"
          test -x "$verify/CodexBridge/Start CodexBridge.command"
          test -x "$verify/CodexBridge/scripts/unix/codex_bridge_manager.sh"
          test -x "$verify/CodexBridge/scripts/unix/codex_bridge_watcher.sh"
          test -x "$verify/CodexBridge/scripts/unix/codex_bridge_uninstall.sh"
          test -x "$verify/CodexBridge/CodexBridge.app/Contents/MacOS/CodexBridge"
          test -f "$verify/CodexBridge/CodexBridge.app/Contents/Info.plist"
          test -x "$verify/CodexBridge/runtime/python/bin/python3"
          test -f "$verify/CodexBridge/src/bridge/codex_provider_bridge.py"
          test -f "$verify/CodexBridge/README.md"
          test -f "$verify/CodexBridge/README.en.md"
          test -f "$verify/CodexBridge/VERSION"
          test -f "$verify/CodexBridge/CHANGELOG.md"
          test -f "$verify/CodexBridge/BUILD.txt"
          test -f "$verify/CodexBridge/docs/ARCHITECTURE.md"
          test -f "$verify/CodexBridge/docs/COMPATIBILITY.md"
          test -f "$verify/CodexBridge/docs/VERSIONING.md"
          test -f "$verify/CodexBridge/docs/PROJECT_OVERVIEW.zh-CN.md"
          test -f "$verify/CodexBridge/docs/USER_GUIDE.zh-CN.md"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$verify/CodexBridge/CodexBridge.app"

      - name: Notarize tagged macOS archive
        if: startsWith(github.ref, 'refs/tags/') && steps.apple-signing.outputs.available == 'true'
        env:
          ASSET: ${{ matrix.asset }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "dist/$ASSET" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait \
            --output-format json > "$result"

          status="$(python3 - "$result" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              print(json.load(fh).get('status', ''))
          PY
          )"
          if [[ "$status" != "Accepted" ]]; then
            echo "::error::Apple notarization did not return Accepted."
            cat "$result"
            exit 1
          fi
          echo "Apple notarization accepted for $ASSET."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexBridge-macOS-${{ matrix.arch }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CodexBridge-macOS-*
          path: dist
          merge-multiple: true

      - name: Label unsigned macOS assets
        if: needs.build.outputs.apple_signing_available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for platform in AppleSilicon Intel; do
            source="dist/CodexBridge-macOS-${platform}.zip"
            target="dist/CodexBridge-macOS-${platform}-unsigned.zip"

            [[ -f "$source" ]] || { echo "::error::Missing macOS build asset: $source"; exit 1; }

            mv "$source" "$target"
            checksum="$(sha256sum "$target" | awk '{print $1}')"
            printf '%s  %s\n' "$checksum" "$(basename "$target")" > "$target.sha256"
            rm -f "$source.sha256"
          done

      - name: Wait for the GitHub Release created by Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"

          for attempt in $(seq 1 24); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "GitHub Release $tag is ready."
              exit 0
            fi
            echo "Waiting for Windows workflow to create GitHub Release $tag... ($attempt/24)"
            sleep 5
          done

          echo "::error::GitHub Release $tag was not created within 120 seconds. Check the Windows release workflow."
          exit 1

      - name: Publish macOS Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.build.outputs.apple_signing_available }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"

          if [[ "$SIGNED" == "true" ]]; then
            assets=(
              dist/CodexBridge-macOS-AppleSilicon.zip
              dist/CodexBridge-macOS-AppleSilicon.zip.sha256
              dist/CodexBridge-macOS-Intel.zip
              dist/CodexBridge-macOS-Intel.zip.sha256
            )
          else
            assets=(
              dist/CodexBridge-macOS-AppleSilicon-unsigned.zip
              dist/CodexBridge-macOS-AppleSilicon-unsigned.zip.sha256
              dist/CodexBridge-macOS-Intel-unsigned.zip
              dist/CodexBridge-macOS-Intel-unsigned.zip.sha256
            )
          fi

          for asset in "${assets[@]}"; do
            [[ -f "$asset" ]] || { echo "::error::Missing release asset: $asset"; exit 1; }
          done

          gh release upload "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
