name: macOS CI / optional release build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
            asset: CodexBridge-macOS-AppleSilicon.zip
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            asset: CodexBridge-macOS-Intel.zip
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Normalize macOS executable permissions
        run: |
          chmod +x "Start CodexBridge.command"
          chmod +x scripts/unix/codex_bridge_manager.sh scripts/unix/codex_bridge_watcher.sh

          git_mode="$(git ls-files --stage -- "Start CodexBridge.command" | awk '{print $1}')"
          if [[ "$git_mode" != "100755" ]]; then
            echo "::warning::Start CodexBridge.command is not marked executable in the Git index. Release artifacts are normalized here, but before publishing the public source ZIP from Windows run scripts/maintainer/PrepareGitHubFromWindows.ps1 and commit the mode change."
          fi

      - name: Create isolated macOS CI test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/codexbridge-ci-venv"
          "$RUNNER_TEMP/codexbridge-ci-venv/bin/python" -m pip install --disable-pip-version-check pytest

      - name: Run regression tests
        run: |
          "$RUNNER_TEMP/codexbridge-ci-venv/bin/python" -m pytest tests -v

      - name: Assemble self-contained portable macOS package
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          stage_parent="$RUNNER_TEMP/CodexBridge Portable 测试 with spaces"
          stage="$stage_parent/CodexBridge"
          verify="$RUNNER_TEMP/CodexBridge Archive Verify"
          rm -rf "$stage_parent" "$verify"
          mkdir -p "$stage/scripts/unix" "$stage/src/bridge" "$stage/runtime" dist

          cp "Start CodexBridge.command" "$stage/"
          cp scripts/unix/codex_bridge_manager.sh "$stage/scripts/unix/"
          cp scripts/unix/codex_bridge_watcher.sh "$stage/scripts/unix/"
          cp src/bridge/codex_provider_bridge.py "$stage/src/bridge/"
          cp README.md README.en.md "$stage/"
          chmod +x "$stage/Start CodexBridge.command" "$stage/scripts/unix/"*.sh

          # Resolve the runtime by asset *name*, not browser_download_url.
          # GitHub percent-encodes the '+' in browser_download_url as %2B, so URL regex
          # matching incorrectly reported that valid macOS Python assets did not exist.
          # Query the latest release's paginated asset endpoint so all ~800 assets are visible.
          release_id="$(gh api repos/astral-sh/python-build-standalone/releases/latest --jq '.id')"
          asset_jq=".[] | select((.name | startswith(\"cpython-3.12.\")) and (.name | endswith(\"-${TARGET}-install_only_stripped.tar.gz\"))) | .browser_download_url"
          url="$(gh api --paginate "repos/astral-sh/python-build-standalone/releases/${release_id}/assets?per_page=100" --jq "$asset_jq" | sed -n '1p')"
          if [[ -z "$url" ]]; then
            echo "::error::Could not find a Python 3.12 ${TARGET} install_only_stripped runtime in the latest python-build-standalone release (release id ${release_id})."
            exit 1
          fi
          case "$url" in
            *"-${TARGET}-install_only_stripped.tar.gz") ;;
            *)
              echo "::error::Resolved an unexpected Python runtime URL: $url"
              exit 1
              ;;
          esac
          echo "Bundling portable Python from: $url"
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/python.tar.gz"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$stage/runtime"

          test -x "$stage/runtime/python/bin/python3"
          "$stage/runtime/python/bin/python3" --version
          "$stage/runtime/python/bin/python3" "$stage/src/bridge/codex_provider_bridge.py" --help >/dev/null
          bash -n "$stage/scripts/unix/codex_bridge_manager.sh"
          bash -n "$stage/scripts/unix/codex_bridge_watcher.sh"
          bash -n "$stage/Start CodexBridge.command"

          echo "${{ github.ref_name }} / ${{ matrix.arch }}" > "$stage/BUILD.txt"
          (cd "$stage_parent" && /usr/bin/ditto -c -k --sequesterRsrc --keepParent "CodexBridge" "$GITHUB_WORKSPACE/dist/$ASSET")
          shasum -a 256 "dist/$ASSET" | awk '{print $1 "  '"$ASSET"'"}' > "dist/$ASSET.sha256"

          mkdir -p "$verify"
          /usr/bin/ditto -x -k "dist/$ASSET" "$verify"
          test -x "$verify/CodexBridge/Start CodexBridge.command"
          test -x "$verify/CodexBridge/scripts/unix/codex_bridge_manager.sh"
          test -x "$verify/CodexBridge/scripts/unix/codex_bridge_watcher.sh"
          test -x "$verify/CodexBridge/runtime/python/bin/python3"
          test -f "$verify/CodexBridge/src/bridge/codex_provider_bridge.py"
          test -f "$verify/CodexBridge/README.md"
          test -f "$verify/CodexBridge/README.en.md"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexBridge-macOS-${{ matrix.arch }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "CodexBridge $tag" --generate-notes >/dev/null 2>&1 || true
          fi

          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::GitHub Release $tag was not available after creation."
              exit 1
            fi
            sleep 2
          done

          gh release upload "$tag" "dist/$ASSET" "dist/$ASSET.sha256" --clobber
