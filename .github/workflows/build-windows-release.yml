name: Windows CI / safe release package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate public version metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION value: $version"
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $expected = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Release tag $env:GITHUB_REF_NAME does not match VERSION ($expected)."
            }
          }
          Write-Host "Public product version: $version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install Windows CI dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Run regression tests
        shell: powershell
        run: python -m pytest tests -v

      - name: Fetch the official Python embeddable runtime for bundling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Ship the upstream archive byte-for-byte so a user can reproduce this
          # digest against python.org. amd64 covers nearly every Windows user;
          # other architectures keep using the mirror download in the bootstrap.
          $package = 'python-3.12.10-embed-amd64.zip'
          $expected = '4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3'
          $dir = Join-Path $PWD '.build\bundled-runtime'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $target = Join-Path $dir $package
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.python.org/ftp/python/3.12.10/$package" -OutFile $target -TimeoutSec 300
          $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Bundled runtime digest mismatch for ${package}: expected $expected, got $actual"
          }
          Write-Host "Bundled runtime verified: $package ($actual)"

      - name: Build safe Windows release package
        shell: powershell
        run: .\scripts\build\BuildWindowsReleasePackage.ps1 -ProjectRoot "$PWD" -BundledRuntimeDir "$PWD\.build\bundled-runtime"

      - name: Smoke-test release package in a Unicode path
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD 'dist\CodexBridge-Windows.zip'
          $root = Join-Path $env:RUNNER_TEMP 'CodexBridge Release 测试 with spaces'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force

          foreach ($relative in @(
            'Start CodexBridge.cmd',
            'VERSION',
            'CHANGELOG.md',
            'src\bridge\codex_provider_bridge.py',
            'src\launcher\CodexBridgeLauncher.cs',
            'scripts\build\BuildCodexBridgeLauncher.ps1',
            'scripts\windows\StartCodexBridge.ps1',
            'scripts\windows\codex_bridge_manager.ps1'
          )) {
            $file = Join-Path $root $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Release package missing $relative" }
          }

          $packagedVersion = (Get-Content -LiteralPath (Join-Path $root 'VERSION') -Raw).Trim()
          $sourceVersion = (Get-Content -LiteralPath (Join-Path $PWD 'VERSION') -Raw).Trim()
          if ($packagedVersion -ne $sourceVersion) { throw "Release package VERSION mismatch: $packagedVersion != $sourceVersion" }

          $downloadedExecutables = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.exe')
          if ($downloadedExecutables.Count -ne 0) {
            throw 'Safe Windows release package must not contain prebuilt .exe files.'
          }

          # The bundled runtime has to arrive as the untouched upstream archive.
          # Had anything extracted it into the package, the .exe check above
          # would already have failed, so this only proves the bytes are intact.
          $bundledRuntime = Join-Path $root 'runtime\python-3.12.10-embed-amd64.zip'
          if (-not (Test-Path -LiteralPath $bundledRuntime -PathType Leaf)) {
            throw 'Release package is missing the bundled Python runtime archive.'
          }
          $bundledExpected = '4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3'
          $bundledActual = (Get-FileHash -LiteralPath $bundledRuntime -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundledActual -ne $bundledExpected) {
            throw "Bundled runtime archive digest mismatch: expected $bundledExpected, got $bundledActual"
          }

          # Prove the offline path a first-time user actually takes. A downloads
          # directory appearing here would mean the bundled archive was skipped
          # and the run quietly depended on the network after all.
          $coldRoot = Join-Path $env:RUNNER_TEMP 'CodexBridge cold runtime test'
          Remove-Item -LiteralPath $coldRoot -Recurse -Force -ErrorAction SilentlyContinue
          $prepared = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\windows\StartCodexBridge.ps1') -ProjectRoot $root -StateRootOverride $coldRoot -PrepareRuntimeOnly
          if ($LASTEXITCODE -ne 0) { throw "Bundled runtime cold-start preparation failed: $prepared" }
          if (-not (Test-Path -LiteralPath (Join-Path $coldRoot 'runtime\python\python.exe') -PathType Leaf)) {
            throw 'Bundled runtime did not produce a usable python.exe.'
          }
          if (Test-Path -LiteralPath (Join-Path $coldRoot 'downloads')) {
            throw 'The bundled runtime path must not fall back to a network download.'
          }

          $launcher = Join-Path $root '.build\CodexBridgeLauncher.exe'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\build\BuildCodexBridgeLauncher.ps1') -ProjectRoot $root -OutputPath $launcher
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw 'Local launcher compilation smoke test failed.'
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexBridge-Windows
          path: |
            dist/CodexBridge-Windows.zip
            dist/CodexBridge-Windows.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: CodexBridge-Windows
          path: dist

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/CodexBridge-Windows.zip \
              dist/CodexBridge-Windows.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" \
              dist/CodexBridge-Windows.zip \
              dist/CodexBridge-Windows.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "CodexBridge $tag" \
              --generate-notes
          fi
