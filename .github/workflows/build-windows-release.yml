name: Windows CI / safe release package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate public version metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION value: $version"
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $expected = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Release tag $env:GITHUB_REF_NAME does not match VERSION ($expected)."
            }
          }
          Write-Host "Public product version: $version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install Windows CI dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Run regression tests
        shell: powershell
        run: python -m pytest tests -v

      - name: Build safe Windows release package
        shell: powershell
        run: .\scripts\build\BuildWindowsReleasePackage.ps1 -ProjectRoot "$PWD"

      - name: Smoke-test release package in a Unicode path
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD 'dist\CodexBridge-Windows.zip'
          $root = Join-Path $env:RUNNER_TEMP 'CodexBridge Release 测试 with spaces'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force

          foreach ($relative in @(
            'Start CodexBridge.cmd',
            'VERSION',
            'CHANGELOG.md',
            'src\bridge\codex_provider_bridge.py',
            'src\launcher\CodexBridgeLauncher.cs',
            'scripts\build\BuildCodexBridgeLauncher.ps1',
            'scripts\windows\StartCodexBridge.ps1',
            'scripts\windows\codex_bridge_manager.ps1'
          )) {
            $file = Join-Path $root $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Release package missing $relative" }
          }

          $packagedVersion = (Get-Content -LiteralPath (Join-Path $root 'VERSION') -Raw).Trim()
          $sourceVersion = (Get-Content -LiteralPath (Join-Path $PWD 'VERSION') -Raw).Trim()
          if ($packagedVersion -ne $sourceVersion) { throw "Release package VERSION mismatch: $packagedVersion != $sourceVersion" }

          $downloadedExecutables = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.exe')
          if ($downloadedExecutables.Count -ne 0) {
            throw 'Safe Windows release package must not contain prebuilt .exe files.'
          }

          $launcher = Join-Path $root '.build\CodexBridgeLauncher.exe'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\build\BuildCodexBridgeLauncher.ps1') -ProjectRoot $root -OutputPath $launcher
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw 'Local launcher compilation smoke test failed.'
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexBridge-Windows
          path: |
            dist/CodexBridge-Windows.zip
            dist/CodexBridge-Windows.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: CodexBridge-Windows
          path: dist

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/CodexBridge-Windows.zip \
              dist/CodexBridge-Windows.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" \
              dist/CodexBridge-Windows.zip \
              dist/CodexBridge-Windows.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "CodexBridge $tag" \
              --generate-notes
          fi
